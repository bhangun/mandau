<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mandau</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-sword"></i>
                </div>
                <h1>Mandau</h1>
                <p class="text-muted">Infrastructure Control Plane</p>
            </div>

            <div class="login-body">
                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember-me">
                        <label class="form-check-label" for="remember-me">Remember me</label>
                    </div>

                    <div id="error-message" class="alert alert-danger d-none" role="alert">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="error-text"></span>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" id="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>

                <div class="login-footer mt-3">
                    <p class="text-muted small">
                        <i class="fas fa-info-circle"></i>
                        Default credentials: <code>admin / mandau-admin-123</code>
                    </p>
                    <p class="text-muted small">
                        Change these credentials in production!
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;
            const btn = document.getElementById('btn-login');
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            // Hide error
            errorDiv.classList.add('d-none');

            // Disable button and show loading
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || 'Login failed');
                }

                // Store token
                localStorage.setItem('mandau-token', result.data.token);
                localStorage.setItem('mandau-username', result.data.username);
                localStorage.setItem('mandau-roles', JSON.stringify(result.data.roles));
                
                if (rememberMe) {
                    localStorage.setItem('mandau-remember', 'true');
                }

                // Redirect to dashboard
                window.location.href = '/';

            } catch (error) {
                errorText.textContent = error.message;
                errorDiv.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        });

        // Check if already logged in
        const token = localStorage.getItem('mandau-token');
        if (token) {
            // Verify token is still valid
            fetch('/api/v1/health', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/';
                }
            })
            .catch(() => {
                // Token invalid, stay on login page
                localStorage.removeItem('mandau-token');
            });
        }

        // Load remembered username
        const remembered = localStorage.getItem('mandau-remember');
        if (remembered) {
            document.getElementById('username').value = localStorage.getItem('mandau-username') || '';
            document.getElementById('remember-me').checked = true;
        }
    </script>
</body>
</html>
