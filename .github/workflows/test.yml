name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.24' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install protoc and Go plugins
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Generate proto files
      run: make proto

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: make build

    - name: Test
      run: |
        go test -v -race -coverprofile=coverage.out ./pkg/auth/... ./pkg/agent/queue/... ./pkg/agent/operation/... ./pkg/middleware/... ./pkg/tlsutil/...
        go tool cover -func=coverage.out | tail -1

    - name: Build static binaries
      run: make build-static

    - name: Generate certificates for testing
      run: make certs

    - name: Verify binaries exist
      run: |
        ls -la bin/
        test -f bin/mandau
        test -f bin/mandau-core
        test -f bin/mandau-agent
        echo "✅ All binaries built successfully"

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./coverage.out
        fail_ci_if_error: false