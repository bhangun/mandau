name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install protoc and Go plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler zip
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          # Add GOPATH bin to PATH for all subsequent steps
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Get tag
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/*/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist
          mkdir -p checksums

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for platform in "${PLATFORMS[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            
            echo "Building ${GOOS}/${GOARCH} binaries..."
            mkdir -p "build/${GOOS}-${GOARCH}"
            
            # Set binary extension for Windows
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            else
              EXT=""
            fi
            
            # Build binaries
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.version=${{ steps.tag.outputs.version }}" \
              -o "build/${GOOS}-${GOARCH}/mandau${EXT}" ./cmd/mandau-cli
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.version=${{ steps.tag.outputs.version }}" \
              -o "build/${GOOS}-${GOARCH}/mandau-core${EXT}" ./cmd/mandau-core
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.version=${{ steps.tag.outputs.version }}" \
              -o "build/${GOOS}-${GOARCH}/mandau-agent${EXT}" ./cmd/mandau-agent

            # Package binaries
            if [ "$GOOS" = "windows" ]; then
              zip -j "dist/mandau-${GOOS}-${GOARCH}-${{ steps.tag.outputs.version }}.zip" \
                "build/${GOOS}-${GOARCH}/mandau.exe" \
                "build/${GOOS}-${GOARCH}/mandau-core.exe" \
                "build/${GOOS}-${GOARCH}/mandau-agent.exe"
            else
              tar -czf "dist/mandau-${GOOS}-${GOARCH}-${{ steps.tag.outputs.version }}.tar.gz" \
                -C "build/${GOOS}-${GOARCH}" mandau mandau-core mandau-agent
            fi

            # Generate checksums
            if [ "$GOOS" = "windows" ]; then
              sha256sum "dist/mandau-${GOOS}-${GOARCH}-${{ steps.tag.outputs.version }}.zip" > "checksums/mandau-${GOOS}-${GOARCH}-${{ steps.tag.outputs.version }}.zip.sha256"
            else
              sha256sum "dist/mandau-${GOOS}-${GOARCH}-${{ steps.tag.outputs.version }}.tar.gz" > "checksums/mandau-${GOOS}-${GOARCH}-${{ steps.tag.outputs.version }}.tar.gz.sha256"
            fi
          done

          # Create combined checksums file
          cat checksums/*.sha256 > dist/SHA256SUMS.txt
          echo "✅ All binaries built and checksummed"

      - name: Copy install script to dist
        run: |
          cp scripts/install.sh dist/
          chmod +x dist/install.sh
          echo "✅ Installation script copied to dist/"

      - name: Verify installation script
        run: |
          bash -n scripts/install.sh
          echo "✅ Installation script syntax valid"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            dist/mandau-linux-amd64-*.tar.gz
            dist/mandau-linux-arm64-*.tar.gz
            dist/mandau-darwin-amd64-*.tar.gz
            dist/mandau-darwin-arm64-*.tar.gz
            dist/mandau-windows-amd64-*.zip
            dist/checksums/*.sha256
            dist/SHA256SUMS.txt
            dist/install.sh
          generate_release_notes: true
          body: |
            ## 🗡️ Mandau ${{ steps.tag.outputs.tag }}

            Production-grade, agent-driven Docker infrastructure management for security-sensitive environments.

            ### 📦 Installation

            **Quick install (recommended):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/bhangun/mandau/main/scripts/install.sh | sudo bash
            ```

            **Or download binaries for your platform:**
            - **Linux AMD64**: `mandau-linux-amd64-${{ steps.tag.outputs.version }}.tar.gz`
            - **Linux ARM64**: `mandau-linux-arm64-${{ steps.tag.outputs.version }}.tar.gz`
            - **macOS AMD64**: `mandau-darwin-amd64-${{ steps.tag.outputs.version }}.tar.gz`
            - **macOS ARM64 (Apple Silicon)**: `mandau-darwin-arm64-${{ steps.tag.outputs.version }}.tar.gz`
            - **Windows AMD64**: `mandau-windows-amd64-${{ steps.tag.outputs.version }}.zip`

            ### 🔐 Verify Checksums

            ```bash
            # Download checksums file
            curl -fsSL https://github.com/bhangun/mandau/releases/download/${{ steps.tag.outputs.tag }}/SHA256SUMS.txt -o SHA256SUMS.txt

            # Verify your download
            sha256sum -c SHA256SUMS.txt
            ```

            ### 🚀 Quick Start

            ```bash
            # Generate certificates
            make certs

            # Start Core server
            mandau-core --listen :8443 --cert ~/mandau-certs/core.crt --key ~/mandau-certs/core.key --ca ~/mandau-certs/ca.crt

            # Start Agent
            mandau-agent --server localhost:8443 --cert ~/mandau-certs/agent.crt --key ~/mandau-certs/agent.key --ca ~/mandau-certs/ca.crt --stack-root ~/mandau-stacks

            # Access web dashboard
            open http://localhost:8080
            ```

            ### ✨ New Features

            - JWT authentication for web dashboard
            - Rate limiting middleware (5 login attempts/min, 60 API requests/min)
            - Operation queue for disconnected scenarios
            - WebSocket fallback transport
            - Raft-based leader election for HA deployments
            - REST API with full CRUD operations
            - TLS utility package for centralized configuration
            - 56 comprehensive unit tests

            ### 📋 Components

            | Binary | Description |
            |--------|-------------|
            | `mandau` | CLI tool for managing infrastructure |
            | `mandau-core` | Central control plane server |
            | `mandau-agent` | Agent that runs on Docker hosts |